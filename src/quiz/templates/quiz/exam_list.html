{% extends 'base.html' %}

{% block title %}Exams{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="mb-0 text-secondary">Exams</h2>
    <a href="{% url 'quiz:exam_create' %}" class="btn btn-primary shadow-sm">Create New Exam</a>
</div>
<div class="card shadow-sm">
    <ul class="list-group list-group-flush">
        {% for exam in exams %}
            <li class="list-group-item d-flex justify-content-between align-items-center p-3">
                <a href="{% url 'quiz:exam_detail' exam.pk %}" class="text-decoration-none fw-bold fs-5">{{ exam.title }}</a>
                <span class="badge bg-secondary rounded-pill">{{ exam.created_at|date:"M d, Y" }}</span>
            </li>
        {% empty %}
            <li class="list-group-item text-muted p-4 text-center">No exams available.</li>
        {% endfor %}
    </ul>
</div>
{% endblock %}
